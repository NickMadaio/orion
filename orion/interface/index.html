<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORION</title>
<style>
  :root {
    --gold: #ffb42e;
    --gold-dim: #d68a1c;
    --ink: #05070c;
    --ink-2: #0a0f18;
    --text: #e8eef7;
    --muted: #78899f;
    --line: rgba(255, 180, 46, 0.16);
    --cool: #78b0ff;
    --bad: #ff5c40;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 400 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient room light so the hologram looks projected into a space. */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(255,150,30,0.09), transparent 62%),
      radial-gradient(90% 70% at 12% 100%, rgba(40,90,170,0.16), transparent 70%),
      radial-gradient(80% 60% at 88% 0%, rgba(30,70,140,0.14), transparent 70%),
      linear-gradient(180deg, #060911 0%, #04060b 55%, #03050a 100%);
    pointer-events: none;
  }

  /* Faint floor grid, echoing the hangar in the reference frame. */
  body::after {
    content: "";
    position: fixed;
    left: -20%; right: -20%; bottom: -6%;
    height: 42%;
    background-image:
      linear-gradient(rgba(120,170,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,0.055) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: perspective(560px) rotateX(72deg);
    transform-origin: bottom center;
    mask-image: linear-gradient(to top, #000 0%, transparent 82%);
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 82%);
    pointer-events: none;
  }

  .shell {
    position: relative;
    z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 26px;
    gap: 16px;
  }

  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: 0.44em;
    font-weight: 600;
    color: var(--gold);
    text-shadow: 0 0 22px rgba(255,180,46,0.45);
  }
  .brand .sub {
    font-size: 10.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .links { display: flex; align-items: center; gap: 10px; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255,180,46,0.03);
    white-space: nowrap;
  }
  .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 8px currentColor;
  }
  .pill[data-ok="true"]  { color: var(--gold); border-color: rgba(255,180,46,0.34); }
  .pill[data-ok="true"] .dot  { background: var(--gold); }
  .pill[data-ok="false"] { color: var(--bad); border-color: rgba(255,92,64,0.34); }
  .pill[data-ok="false"] .dot { background: var(--bad); }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
  }
  #holo {
    width: min(78vh, 78vw);
    height: min(78vh, 78vw);
    display: block;
  }

  .readout {
    position: absolute;
    bottom: 4%;
    width: min(760px, 88vw);
    text-align: center;
    pointer-events: none;
  }
  .heard {
    min-height: 1.6em;
    font-size: 17px;
    color: var(--text);
    opacity: 0.92;
    text-shadow: 0 2px 18px rgba(0,0,0,0.8);
  }
  .heard.interim { opacity: 0.5; font-style: italic; }
  .statusline {
    margin-top: 8px;
    font-size: 10.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-dim);
    min-height: 1.4em;
  }
  .statusline.err { color: var(--bad); }

  /* ---------- transcript ---------- */
  .transcript {
    position: absolute;
    top: 0; right: 0;
    width: min(400px, 34vw);
    height: 100%;
    padding: 8px 22px 22px;
    overflow-y: auto;
    scrollbar-width: thin;
    display: flex;
    flex-direction: column;
    gap: 12px;
    mask-image: linear-gradient(to bottom, transparent 0, #000 34px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 34px);
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .transcript[hidden] { display: none; }
  .transcript.dim { opacity: 0.22; }
  .transcript:hover { opacity: 1; }

  .turn {
    border-left: 2px solid var(--line);
    padding: 2px 0 2px 12px;
    font-size: 13.5px;
    animation: rise 0.3s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .turn .who {
    font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 3px;
  }
  .turn.you { border-color: rgba(120,176,255,0.34); }
  .turn.you .who { color: var(--cool); }
  .turn.orion { border-color: rgba(255,180,46,0.4); }
  .turn.orion .who { color: var(--gold); }
  .turn.sys { border-color: rgba(255,92,64,0.4); }
  .turn.sys .who { color: var(--bad); }
  .turn .body { white-space: pre-wrap; word-break: break-word; color: #cfdaea; }

  /* ---------- footer ---------- */
  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px 26px 26px;
  }

  .composer {
    display: flex; align-items: center; gap: 10px;
    width: min(680px, 84vw);
    padding: 7px 7px 7px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(8,12,20,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .composer:focus-within { border-color: rgba(255,180,46,0.42); }
  .composer input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: none;
    color: var(--text); font: inherit;
  }
  .composer input::placeholder { color: #56657a; }

  button {
    font: inherit; cursor: pointer;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,180,46,0.07);
    color: var(--gold);
    padding: 8px 16px;
    letter-spacing: 0.1em;
    font-size: 11.5px;
    text-transform: uppercase;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) { background: rgba(255,180,46,0.16); border-color: rgba(255,180,46,0.44); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }

  .mic {
    width: 42px; height: 42px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .mic svg { width: 17px; height: 17px; fill: currentColor; }
  .mic.live {
    background: var(--gold); color: #1a0f00;
    border-color: var(--gold);
    box-shadow: 0 0 0 6px rgba(255,180,46,0.14), 0 0 26px rgba(255,180,46,0.5);
  }

  .ghost { background: none; color: var(--muted); }
  .ghost:hover:not(:disabled) { color: var(--gold); background: rgba(255,180,46,0.08); }

  .hint {
    position: absolute; left: 26px; bottom: 26px;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #4d5a6d;
  }
  kbd {
    font: inherit; font-size: 10px;
    border: 1px solid #2a3546; border-radius: 4px;
    padding: 1px 5px; color: var(--muted);
  }

  @media (max-width: 900px) {
    .transcript { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <h1>ORION</h1>
      <span class="sub">local assistant</span>
    </div>
    <div class="links">
      <span class="pill" id="pill-gateway"><span class="dot"></span><span>gateway</span></span>
      <span class="pill" id="pill-voice"><span class="dot"></span><span>voice</span></span>
      <button class="ghost" id="toggle-transcript" title="Toggle transcript">transcript</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="holo"></canvas>

    <div class="readout">
      <div class="heard" id="heard"></div>
      <div class="statusline" id="status">standing by</div>
    </div>

    <aside class="transcript dim" id="transcript"></aside>
    <div class="hint">hold <kbd>space</kbd> to talk · <kbd>esc</kbd> to stop</div>
  </div>

  <footer>
    <form class="composer" id="composer">
      <input id="input" placeholder="Ask Orion…" autocomplete="off" spellcheck="false">
      <button class="mic" id="mic" type="button" title="Hold to talk" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-5 5.92V21h-2v-3.58a6 6 0 0 1-5-5.92h2a4 4 0 0 0 8 0Z"/></svg>
      </button>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>

</div>

<script type="module">
import { Hologram } from "./hologram.js";

/* ------------------------------------------------------------------ *
 * Elements
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const els = {
  holo: $("holo"), heard: $("heard"), status: $("status"),
  transcript: $("transcript"), composer: $("composer"), input: $("input"),
  mic: $("mic"), send: $("send"), toggle: $("toggle-transcript"),
  gateway: $("pill-gateway"), voice: $("pill-voice"),
};

const holo = new Hologram(els.holo);
holo.start();

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
const SESSION = "orion-interface";
let busy = false;
let listening = false;
let audioCtx = null;
let currentSource = null;   // in-flight TTS playback, for barge-in
let micAnalyser = null;
let micStream = null;

function setState(name, text) {
  holo.setState(name);
  if (text !== undefined) {
    els.status.textContent = text;
    els.status.classList.toggle("err", name === "error");
  }
}

function addTurn(who, body, cls) {
  const el = document.createElement("div");
  el.className = `turn ${cls}`;
  el.innerHTML = `<div class="who"></div><div class="body"></div>`;
  el.querySelector(".who").textContent = who;
  el.querySelector(".body").textContent = body;
  els.transcript.append(el);
  els.transcript.scrollTop = els.transcript.scrollHeight;
  return el;
}

/* ------------------------------------------------------------------ *
 * Bridge
 * ------------------------------------------------------------------ */
async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

async function health() {
  try {
    const h = await api("/api/health");
    els.gateway.dataset.ok = String(!!h.gateway);
    els.voice.dataset.ok = String(!!h.tts);
    els.gateway.lastElementChild.textContent = h.gateway ? "gateway" : "gateway down";
    els.voice.lastElementChild.textContent = h.tts ? (h.tts_warm ? "voice warm" : "voice cold") : "voice down";
    return h;
  } catch {
    els.gateway.dataset.ok = "false";
    els.gateway.lastElementChild.textContent = "bridge down";
    delete els.voice.dataset.ok;
    return null;
  }
}
health();
setInterval(health, 15000);

/* ------------------------------------------------------------------ *
 * Speech out — playback drives the hologram via an AnalyserNode, so the
 * shell is reacting to the actual waveform rather than a fake animation.
 * ------------------------------------------------------------------ */
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function stopSpeaking() {
  if (currentSource) {
    try { currentSource.stop(); } catch {}
    currentSource = null;
  }
}

async function speak(text) {
  if (!text.trim()) return;
  const ctx = ensureAudio();
  let buf;
  try {
    const res = await fetch("/api/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(await res.text());
    buf = await ctx.decodeAudioData(await res.arrayBuffer());
  } catch (err) {
    console.warn("tts failed", err);
    return;
  }

  stopSpeaking();
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.55;
  src.connect(analyser);
  analyser.connect(ctx.destination);
  currentSource = src;

  const bins = new Uint8Array(analyser.frequencyBinCount);
  setState("speaking", "speaking");

  const tick = () => {
    if (currentSource !== src) return;
    analyser.getByteFrequencyData(bins);
    let sum = 0;
    for (let i = 0; i < bins.length; i++) sum += bins[i];
    holo.setLevel(Math.min(1, (sum / bins.length / 255) * 2.4));
    requestAnimationFrame(tick);
  };

  return new Promise((resolve) => {
    src.onended = () => {
      if (currentSource === src) {
        currentSource = null;
        holo.setLevel(0);
        setState("idle", "standing by");
      }
      resolve();
    };
    src.start();
    tick();
  });
}

/* ------------------------------------------------------------------ *
 * Speech in — Web Speech API for streaming interim transcripts (fast and
 * free), plus a live mic analyser so the shell reacts while you talk.
 * ------------------------------------------------------------------ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;

if (SR) {
  recog = new SR();
  recog.continuous = false;
  recog.interimResults = true;
  recog.lang = navigator.language || "en-US";

  recog.onresult = (ev) => {
    let finalText = "";
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (interim) {
      els.heard.textContent = interim;
      els.heard.classList.add("interim");
    }
    if (finalText.trim()) {
      els.heard.textContent = finalText;
      els.heard.classList.remove("interim");
      stopListening();
      ask(finalText.trim());
    }
  };

  recog.onerror = (ev) => {
    stopListening();
    if (ev.error === "no-speech") setState("idle", "standing by");
    else setState("error", `mic: ${ev.error}`);
  };

  recog.onend = () => { if (listening) stopListening(); };
} else {
  els.mic.disabled = true;
  els.mic.title = "Speech recognition needs Chrome";
}

async function startMicMeter() {
  try {
    const ctx = ensureAudio();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });
    const src = ctx.createMediaStreamSource(micStream);
    micAnalyser = ctx.createAnalyser();
    micAnalyser.fftSize = 512;
    micAnalyser.smoothingTimeConstant = 0.6;
    src.connect(micAnalyser);

    const bins = new Uint8Array(micAnalyser.frequencyBinCount);
    const tick = () => {
      if (!micAnalyser) return;
      micAnalyser.getByteFrequencyData(bins);
      let sum = 0;
      for (let i = 0; i < bins.length; i++) sum += bins[i];
      holo.setLevel(Math.min(1, (sum / bins.length / 255) * 3.2));
      requestAnimationFrame(tick);
    };
    tick();
  } catch (err) {
    console.warn("mic meter unavailable", err);
  }
}

function stopMicMeter() {
  micAnalyser = null;
  if (micStream) {
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
  }
  holo.setLevel(0);
}

function startListening() {
  if (listening || busy || !recog) return;
  stopSpeaking();               // barge-in: talking over Orion cuts it off
  listening = true;
  els.mic.classList.add("live");
  els.heard.textContent = "";
  els.heard.classList.remove("interim");
  setState("listening", "listening");
  startMicMeter();
  try { recog.start(); } catch {}
}

function stopListening() {
  if (!listening) return;
  listening = false;
  els.mic.classList.remove("live");
  stopMicMeter();
  try { recog.stop(); } catch {}
  if (!busy) setState("idle", "standing by");
}

/* ------------------------------------------------------------------ *
 * Turn
 * ------------------------------------------------------------------ */
async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true;
  els.send.disabled = true;
  addTurn("you", text, "you");
  els.heard.textContent = text;
  els.heard.classList.remove("interim");
  setState("thinking", "thinking");

  const started = performance.now();
  try {
    const res = await api("/api/ask", { text, session: SESSION });
    const reply = (res.reply || "").trim() || "(no reply)";
    const ms = Math.round(performance.now() - started);
    addTurn(`orion · ${ms}ms`, reply, "orion");
    els.heard.textContent = "";
    busy = false;
    els.send.disabled = false;
    await speak(reply);
  } catch (err) {
    addTurn("error", String(err.message || err), "sys");
    setState("error", "failed");
    busy = false;
    els.send.disabled = false;
    setTimeout(() => setState("idle", "standing by"), 2600);
  }
}

/* ------------------------------------------------------------------ *
 * Input wiring
 * ------------------------------------------------------------------ */
els.composer.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = els.input.value.trim();
  if (!text) return;
  els.input.value = "";
  ask(text);
});

// Push-to-talk: hold the button, or hold space anywhere outside the field.
els.mic.addEventListener("pointerdown", (e) => { e.preventDefault(); startListening(); });
els.mic.addEventListener("pointerup", stopListening);
els.mic.addEventListener("pointerleave", () => { if (listening) stopListening(); });

let spaceHeld = false;
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && document.activeElement !== els.input && !spaceHeld) {
    e.preventDefault();
    spaceHeld = true;
    startListening();
  }
  if (e.key === "Escape") {
    stopListening();
    stopSpeaking();
    setState("idle", "standing by");
  }
  if (e.key === "/" && document.activeElement !== els.input) {
    e.preventDefault();
    els.input.focus();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space" && spaceHeld) {
    spaceHeld = false;
    stopListening();
  }
});

els.toggle.addEventListener("click", () => {
  els.transcript.hidden = !els.transcript.hidden;
});
els.transcript.addEventListener("pointerenter", () => els.transcript.classList.remove("dim"));
els.transcript.addEventListener("pointerleave", () => els.transcript.classList.add("dim"));

addTurn("orion", "Interface online. Hold space to talk.", "orion");
</script>
</body>
</html>
