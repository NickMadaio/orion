<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORION</title>
<style>
  :root {
    --gold: #ffb42e;
    --gold-dim: #d68a1c;
    --ink: #05070c;
    --ink-2: #0a0f18;
    --text: #e8eef7;
    --muted: #78899f;
    --line: rgba(255, 180, 46, 0.16);
    --cool: #78b0ff;
    --bad: #ff5c40;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 400 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient room light so the hologram looks projected into a space. */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(255,150,30,0.09), transparent 62%),
      radial-gradient(90% 70% at 12% 100%, rgba(40,90,170,0.16), transparent 70%),
      radial-gradient(80% 60% at 88% 0%, rgba(30,70,140,0.14), transparent 70%),
      linear-gradient(180deg, #060911 0%, #04060b 55%, #03050a 100%);
    pointer-events: none;
  }

  /* Faint floor grid, echoing the hangar in the reference frame. */
  body::after {
    content: "";
    position: fixed;
    left: -20%; right: -20%; bottom: -6%;
    height: 42%;
    background-image:
      linear-gradient(rgba(120,170,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,0.055) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: perspective(560px) rotateX(72deg);
    transform-origin: bottom center;
    mask-image: linear-gradient(to top, #000 0%, transparent 82%);
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 82%);
    pointer-events: none;
  }

  .shell {
    position: relative;
    z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 26px;
    gap: 16px;
  }

  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: 0.44em;
    font-weight: 600;
    color: var(--gold);
    text-shadow: 0 0 22px rgba(255,180,46,0.45);
  }
  .brand .sub {
    font-size: 10.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .links { display: flex; align-items: center; gap: 10px; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255,180,46,0.03);
    white-space: nowrap;
  }
  .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 8px currentColor;
  }
  .pill[data-ok="true"]  { color: var(--gold); border-color: rgba(255,180,46,0.34); }
  .pill[data-ok="true"] .dot  { background: var(--gold); }
  .pill[data-ok="false"] { color: var(--bad); border-color: rgba(255,92,64,0.34); }
  .pill[data-ok="false"] .dot { background: var(--bad); }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
  }
  #holo {
    width: min(78vh, 78vw);
    height: min(78vh, 78vw);
    display: block;
  }

  .readout {
    position: absolute;
    bottom: 4%;
    width: min(760px, 88vw);
    text-align: center;
    pointer-events: none;
  }
  .heard {
    min-height: 1.6em;
    font-size: 17px;
    color: var(--text);
    opacity: 0.92;
    text-shadow: 0 2px 18px rgba(0,0,0,0.8);
  }
  .heard.interim { opacity: 0.5; font-style: italic; }
  .statusline {
    margin-top: 8px;
    font-size: 10.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-dim);
    min-height: 1.4em;
  }
  .statusline.err { color: var(--bad); }

  /* ---------- transcript ---------- */
  .transcript {
    position: absolute;
    top: 0; right: 0;
    width: min(400px, 34vw);
    height: 100%;
    padding: 8px 22px 22px;
    overflow-y: auto;
    scrollbar-width: thin;
    display: flex;
    flex-direction: column;
    gap: 12px;
    mask-image: linear-gradient(to bottom, transparent 0, #000 34px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 34px);
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .transcript[hidden] { display: none; }
  .transcript.dim { opacity: 0.22; }
  .transcript:hover { opacity: 1; }

  .turn {
    border-left: 2px solid var(--line);
    padding: 2px 0 2px 12px;
    font-size: 13.5px;
    animation: rise 0.3s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .turn .who {
    font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 3px;
  }
  .turn.you { border-color: rgba(120,176,255,0.34); }
  .turn.you .who { color: var(--cool); }
  .turn.orion { border-color: rgba(255,180,46,0.4); }
  .turn.orion .who { color: var(--gold); }
  .turn.sys { border-color: rgba(255,92,64,0.4); }
  .turn.sys .who { color: var(--bad); }
  .turn .body { white-space: pre-wrap; word-break: break-word; color: #cfdaea; }

  /* ---------- footer ---------- */
  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px 26px 26px;
  }

  .composer {
    display: flex; align-items: center; gap: 10px;
    width: min(680px, 84vw);
    padding: 7px 7px 7px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(8,12,20,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .composer:focus-within { border-color: rgba(255,180,46,0.42); }
  .composer input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: none;
    color: var(--text); font: inherit;
  }
  .composer input::placeholder { color: #56657a; }

  button {
    font: inherit; cursor: pointer;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,180,46,0.07);
    color: var(--gold);
    padding: 8px 16px;
    letter-spacing: 0.1em;
    font-size: 11.5px;
    text-transform: uppercase;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) { background: rgba(255,180,46,0.16); border-color: rgba(255,180,46,0.44); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }

  .mic {
    width: 42px; height: 42px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .mic svg { width: 17px; height: 17px; fill: currentColor; }
  .mic.live {
    background: var(--gold); color: #1a0f00;
    border-color: var(--gold);
    box-shadow: 0 0 0 6px rgba(255,180,46,0.14), 0 0 26px rgba(255,180,46,0.5);
  }

  .ghost { background: none; color: var(--muted); }
  .ghost:hover:not(:disabled) { color: var(--gold); background: rgba(255,180,46,0.08); }

  .hint {
    position: absolute; left: 26px; bottom: 26px;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #4d5a6d;
  }
  kbd {
    font: inherit; font-size: 10px;
    border: 1px solid #2a3546; border-radius: 4px;
    padding: 1px 5px; color: var(--muted);
  }

  @media (max-width: 900px) {
    .transcript { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <h1>ORION</h1>
      <span class="sub">local assistant</span>
    </div>
    <div class="links">
      <span class="pill" id="pill-gateway"><span class="dot"></span><span>gateway</span></span>
      <span class="pill" id="pill-voice"><span class="dot"></span><span>voice</span></span>
      <button class="ghost" id="toggle-transcript" title="Toggle transcript">transcript</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="holo"></canvas>

    <div class="readout">
      <div class="heard" id="heard"></div>
      <div class="statusline" id="status">standing by</div>
    </div>

    <aside class="transcript dim" id="transcript"></aside>
    <div class="hint">hold <kbd>space</kbd> to talk · <kbd>esc</kbd> to stop</div>
  </div>

  <footer>
    <form class="composer" id="composer">
      <input id="input" placeholder="Ask Orion…" autocomplete="off" spellcheck="false">
      <button class="mic" id="mic" type="button" title="Hold to talk" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-5 5.92V21h-2v-3.58a6 6 0 0 1-5-5.92h2a4 4 0 0 0 8 0Z"/></svg>
      </button>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
